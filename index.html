<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLingo</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Подключение стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Шапка -->
        <header class="header">
            <div class="logo">&lt;Code_/#&gt;</div>
            <div class="stepper" id="onboardSteps">
                <span class="step active" data-step="0"></span>
                <span class="step" data-step="1"></span>
                <span class="step" data-step="2"></span>
            </div>
        </header>

        <!-- Экран 1: Приветствие -->
        <main class="screen active" data-screen="welcome">
            <h1 class="title">Учи код так же затягивающе, как учат языки</h1>
            
            <div class="code-box">
                <pre><code>import future

future = future.compile(you)
"готов начать?"</code></pre>
            </div>

            <button class="btn primary-btn" id="startBtn">Начать →</button>
        </main>
    </div>

    <!-- Скрипт приложения -->
    <script src="app.js"></script>
</body>
</html>
