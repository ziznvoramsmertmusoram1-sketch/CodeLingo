<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CodeLingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="app">

  <div class="onboard-steps" id="onboardSteps">
    <span class="step active" data-step="0"></span>
    <span class="step" data-step="1"></span>
    <span class="step" data-step="2"></span>
  </div>

  <section class="screen active" data-screen="welcome">
    <div class="screen-inner center">
      <div class="logo">
        <span class="logo-bracket">&lt;</span>Code<span class="cursor">_</span><span class="logo-bracket">/&gt;</span>
      </div>
      <p class="tagline">учи код так же затягивающе,<br>как учат языки</p>
      <div class="terminal-card">
        <div class="terminal-dots"><i></i><i></i><i></i></div>
        <pre class="terminal-body"><span class="tk-kw">import</span> future

<span class="tk-var">future</span> = future.<span class="tk-fn">compile</span>(you)
<span class="tk-str">"готов начать?"</span></pre>
      </div>
      <button class="btn btn-primary" id="btnStart">Начать →</button>
    </div>
